name: Android APK
on:
  push:
    branches: ['feature/android-mvp', main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prototype regression tests
        run: python3 -m unittest discover -s pr3_prototype -v
      - name: Android validation tests
        run: |
          mkdir -p /tmp/razgrom-tests
          javac -encoding UTF-8 -d /tmp/razgrom-tests android/src/main/java/ru/razgrom/diary/Rules.java tests/RulesTest.java
          java -cp /tmp/razgrom-tests ru.razgrom.diary.RulesTest
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify APK
        run: python3 build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: Razgrom-APK
          path: dist/Razgrom-1.0.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Razgrom-APK
          path: dist
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Razgrom-1.0.apk --repo "$GITHUB_REPOSITORY" --verify-tag --title "Разгром 1.0" --notes "Учебная сборка для Android 8.0 и новее."

