plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.chaquo.python' version '16.1.0'
}
android {
    namespace 'ru.razgrom.diary'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.razgrom.diary.python'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
}
chaquopy {
    defaultConfig {
        version '3.12'
        if (System.getenv('BUILD_PYTHON')) buildPython System.getenv('BUILD_PYTHON')
        staticProxy 'diary_ui', 'diary_alarms'
    }
    sourceSets {
        main { srcDir '../pr3_prototype'; exclude 'test_*.py' }
    }
}
